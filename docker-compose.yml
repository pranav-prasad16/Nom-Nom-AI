# ─── Podman Compose ───────────────────────────────────────────────────────────
# Workflow:
#   1. Build the API image first:  podman build -t nom-nom-api -f apps/api/Dockerfile .
#                              or: pnpm podman:build
#   2. Start all containers:       podman-compose up -d
#                              or: pnpm podman:up
#   3. Stop all containers:        podman-compose down
#                              or: pnpm podman:down
#
# NOTE: podman-compose 1.x has a bug where it ignores the "dockerfile:" key and
# fails when the build context path contains spaces. The API service therefore
# uses "image:" instead of "build:". Run  pnpm podman:build  whenever source
# changes, then  pnpm podman:up  to restart with the new image.
#
# Podman runs rootless by default. The API container already uses a non-root
# user (appuser) in the Dockerfile, so no extra changes are needed there.
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: nom-nom-postgres
    # "always" is not supported in rootless Podman without a systemd unit.
    # Use "on-failure" instead, which works reliably with podman-compose.
    restart: on-failure
    environment:
      POSTGRES_USER: nomnom
      POSTGRES_PASSWORD: nomnom
      POSTGRES_DB: nomnomdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomnom -d nomnomdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # Pre-built image. Rebuild with: podman build -t nom-nom-api -f apps/api/Dockerfile .
    # podman-compose 1.x cannot resolve a "dockerfile:" path when the context
    # directory contains spaces — using "image:" is the reliable workaround.
    image: localhost/nom-nom-api:latest
    container_name: nom-nom-api
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - apps/api/.env
    environment:
      # "postgres" resolves to the postgres container via the shared podman network
      DATABASE_URL: postgresql://nomnom:nomnom@postgres:5432/nomnomdb
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
